<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="128" height="128">

<defs>

<radialGradient id="glow" cx="70%" cy="25%" r="60%">
  <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</radialGradient>

<!-- rotating background gradient -->
<linearGradient id="badgeGrad"
                x1="0" y1="0" x2="1" y2="1"
                gradientUnits="objectBoundingBox">

  <animateTransform attributeName="gradientTransform"
                    type="rotate"
                    values="0 0.5 0.5; 360 0.5 0.5"
                    dur="10s"
                    repeatCount="indefinite"/>

  <stop offset="0%" stop-color="#d4af37"/>
  <stop offset="50%" stop-color="#fef1b7"/>
  <stop offset="100%" stop-color="#b8860b"/>

</linearGradient>

<!-- gold border -->
<linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#d0b113"/>
  <stop offset="25%" stop-color="#f7d774"/>
  <stop offset="50%" stop-color="#d4af37"/>
  <stop offset="75%" stop-color="#978120"/>
  <stop offset="100%" stop-color="#b8860b"/>
</linearGradient>

<!-- shine gradient -->
<linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="49%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="50%" stop-color="rgba(255,255,255,0.9)"/>
  <stop offset="51%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</linearGradient>

<!-- clip circle -->
<clipPath id="badgeClip">
  <circle cx="320" cy="320" r="320"/>
</clipPath>

</defs>

<!-- BORDER -->
<circle cx="320" cy="320" r="280"
        fill="none"
        stroke="url(#goldStroke)"
        stroke-width="80"
        stroke-linecap="round"/>

<!-- BADGE FILL -->
<circle cx="320" cy="320" r="280"
        fill="url(#badgeGrad)"/>

<filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
  <!-- take alpha of shape -->
  <feOffset dx="1" dy="3" />
  <feGaussianBlur stdDeviation="3" result="offset-blur"/>

  <feComposite
    operator="out"
    in="SourceGraphic"
    in2="offset-blur"
    result="inverse"/>

  <feFlood flood-color="black" flood-opacity="0.55" result="color"/>
  <feComposite operator="in" in="color" in2="inverse" result="shadow"/>

  <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
</filter>

<filter id="innerHighlight" x="-50%" y="-50%" width="200%" height="200%">
  <feOffset dx="0" dy="-1" />
  <feGaussianBlur stdDeviation="1.5" result="blur"/>
  <feFlood flood-color="white" flood-opacity="0.25"/>
  <feComposite operator="in" in2="blur"/>
  <feComposite operator="over" in="SourceGraphic"/>
</filter>

<circle cx="320" cy="320" r="280" fill="url(#glow)"/>

<!-- ICON (middle layer) -->
<g transform="translate(320 320) scale(0.65) translate(-320 -320)" filter="url(#innerShadow) url(#innerHighlight)">
<path fill="#91813c" 
d="M184 48C170.7 48 160 58.7 160 72C160 110.9 183.4 131.4 199.1 145.1L200.2 146.1C216.5 160.4 224 167.9 224 184C224 197.3 234.7 208 248 208C261.3 208 272 197.3 272 184C272 145.1 248.6 124.6 232.9 110.9L231.8 109.9C215.5 95.7 208 88.1 208 72C208 58.7 197.3 48 184 48zM128 256C110.3 256 96 270.3 96 288L96 480C96 533 139 576 192 576L384 576C425.8 576 461.4 549.3 474.5 512L480 512C550.7 512 608 454.7 608 384C608 313.3 550.7 256 480 256L128 256zM480 448L480 320C515.3 320 544 348.7 544 384C544 419.3 515.3 448 480 448zM320 72C320 58.7 309.3 48 296 48C282.7 48 272 58.7 272 72C272 110.9 295.4 131.4 311.1 145.1L312.2 146.1C328.5 160.4 336 167.9 336 184C336 197.3 346.7 208 360 208C373.3 208 384 197.3 384 184C384 145.1 360.6 124.6 344.9 110.9L343.8 109.9C327.5 95.7 320 88.1 320 72z"/>
</g>


<!-- SHINE (LONG + FULL SWEEP) -->
<g clip-path="url(#badgeClip)" pointer-events="none">

  <rect x="-800" y="0" width="1800" height="800"
        fill="url(#shineGrad)"
        opacity="0.65"
        transform="rotate(205 320 320)">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="1400 0"
      to="-1400 0"
      dur="4.5s"
      repeatCount="indefinite"
      additive="sum"/>
  </rect>

</g>

</svg>