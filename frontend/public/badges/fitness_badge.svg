<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="128" height="128">

<defs>

<radialGradient id="glow" cx="70%" cy="25%" r="60%">
  <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</radialGradient>

<!-- rotating background gradient -->
<linearGradient id="badgeGrad"
                x1="0" y1="0" x2="1" y2="1"
                gradientUnits="objectBoundingBox">

  <animateTransform attributeName="gradientTransform"
                    type="rotate"
                    values="0 0.5 0.5; 360 0.5 0.5"
                    dur="10s"
                    repeatCount="indefinite"/>

  <stop offset="0%" stop-color="#d4af37"/>
  <stop offset="50%" stop-color="#fef1b7"/>
  <stop offset="100%" stop-color="#b8860b"/>

</linearGradient>

<!-- gold border -->
<linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#d0b113"/>
  <stop offset="25%" stop-color="#f7d774"/>
  <stop offset="50%" stop-color="#d4af37"/>
  <stop offset="75%" stop-color="#978120"/>
  <stop offset="100%" stop-color="#b8860b"/>
</linearGradient>

<!-- shine gradient -->
<linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="49%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="50%" stop-color="rgba(255,255,255,0.9)"/>
  <stop offset="51%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</linearGradient>

<!-- clip circle -->
<clipPath id="badgeClip">
  <circle cx="320" cy="320" r="320"/>
</clipPath>

</defs>

<!-- BORDER -->
<circle cx="320" cy="320" r="280"
        fill="none"
        stroke="url(#goldStroke)"
        stroke-width="80"
        stroke-linecap="round"/>

<!-- BADGE FILL -->
<circle cx="320" cy="320" r="280"
        fill="url(#badgeGrad)"/>

<filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
  <!-- take alpha of shape -->
  <feOffset dx="1" dy="3" />
  <feGaussianBlur stdDeviation="3" result="offset-blur"/>

  <feComposite
    operator="out"
    in="SourceGraphic"
    in2="offset-blur"
    result="inverse"/>

  <feFlood flood-color="black" flood-opacity="0.55" result="color"/>
  <feComposite operator="in" in="color" in2="inverse" result="shadow"/>

  <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
</filter>

<filter id="innerHighlight" x="-50%" y="-50%" width="200%" height="200%">
  <feOffset dx="0" dy="-1" />
  <feGaussianBlur stdDeviation="1.5" result="blur"/>
  <feFlood flood-color="white" flood-opacity="0.25"/>
  <feComposite operator="in" in2="blur"/>
  <feComposite operator="over" in="SourceGraphic"/>
</filter>

<circle cx="320" cy="320" r="280" fill="url(#glow)"/>

<!-- ICON (middle layer) -->
<g transform="translate(320 320) scale(0.65) translate(-200 -250)"
  fill="#91813c"
  stroke="#91813c"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  filter="url(#innerShadow) url(#innerHighlight)">

  <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
  <path d="M256.5-32a56 56 0 1 1 0 112 56 56 0 1 1 0-112zM123.6 176c-3.3 0-6.2 2-7.4 5L94.2 235.9c-6.6 16.4-25.2 24.4-41.6 17.8s-24.4-25.2-17.8-41.6l21.9-54.9C67.7 129.9 94.1 112 123.6 112l97.3 0c28.5 0 54.8 15.1 69.1 39.7l32.8 56.3 61.6 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-61.6 0c-22.8 0-43.8-12.1-55.3-31.8l-10-17.1-20.7 70.4 75.4 22.6c27.7 8.3 41.8 39 30.1 65.5L285.7 509c-7.2 16.2-26.1 23.4-42.2 16.2s-23.4-26.1-16.2-42.2l49.2-110.8-95.9-28.8c-32.7-9.8-52-43.7-43.7-76.8l22.7-90.6-35.9 0zm-8 181c13.3 14.9 30.7 26.3 51.2 32.4l4.7 1.4-6.9 19.3c-5.8 16.3-16 30.8-29.3 41.8L52.9 519.8c-13.6 11.2-33.8 9.3-45-4.3s-9.3-33.8 4.3-45l82.4-67.9c4.5-3.7 7.8-8.5 9.8-13.9L115.6 357z"/>
</g>


<!-- SHINE (LONG + FULL SWEEP) -->
<g clip-path="url(#badgeClip)" pointer-events="none">
  <rect x="-800" y="0" width="1800" height="800"
        fill="url(#shineGrad)"
        opacity="0.65"
        transform="rotate(205 320 320)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="1400 0"
      to="-1400 0"
      dur="4.5s"
      repeatCount="indefinite"
      additive="sum"/>
  </rect>
</g>

</svg>