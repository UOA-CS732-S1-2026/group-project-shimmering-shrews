<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="128" height="128">

<defs>

<radialGradient id="glow" cx="70%" cy="25%" r="60%">
  <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</radialGradient>

<!-- rotating background gradient -->
<linearGradient id="badgeGrad"
                x1="0" y1="0" x2="1" y2="1"
                gradientUnits="objectBoundingBox">

  <animateTransform attributeName="gradientTransform"
                    type="rotate"
                    values="0 0.5 0.5; 360 0.5 0.5"
                    dur="10s"
                    repeatCount="indefinite"/>

  <stop offset="0%" stop-color="#d4af37"/>
  <stop offset="50%" stop-color="#fef1b7"/>
  <stop offset="100%" stop-color="#b8860b"/>

</linearGradient>

<!-- gold border -->
<linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#d0b113"/>
  <stop offset="25%" stop-color="#f7d774"/>
  <stop offset="50%" stop-color="#d4af37"/>
  <stop offset="75%" stop-color="#978120"/>
  <stop offset="100%" stop-color="#b8860b"/>
</linearGradient>

<!-- shine gradient -->
<linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="49%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="50%" stop-color="rgba(255,255,255,0.9)"/>
  <stop offset="51%" stop-color="rgba(255,255,255,0)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</linearGradient>

<!-- clip circle -->
<clipPath id="badgeClip">
  <circle cx="320" cy="320" r="320"/>
</clipPath>

</defs>

<!-- BORDER -->
<circle cx="320" cy="320" r="280"
        fill="none"
        stroke="url(#goldStroke)"
        stroke-width="80"
        stroke-linecap="round"/>

<!-- BADGE FILL -->
<circle cx="320" cy="320" r="280"
        fill="url(#badgeGrad)"/>

<filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
  <!-- take alpha of shape -->
  <feOffset dx="1" dy="3" />
  <feGaussianBlur stdDeviation="3" result="offset-blur"/>

  <feComposite
    operator="out"
    in="SourceGraphic"
    in2="offset-blur"
    result="inverse"/>

  <feFlood flood-color="black" flood-opacity="0.55" result="color"/>
  <feComposite operator="in" in="color" in2="inverse" result="shadow"/>

  <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
</filter>

<filter id="innerHighlight" x="-50%" y="-50%" width="200%" height="200%">
  <feOffset dx="0" dy="-1" />
  <feGaussianBlur stdDeviation="1.5" result="blur"/>
  <feFlood flood-color="white" flood-opacity="0.25"/>
  <feComposite operator="in" in2="blur"/>
  <feComposite operator="over" in="SourceGraphic"/>
</filter>

<circle cx="320" cy="320" r="280" fill="url(#glow)"/>

<!-- ICON (middle layer) -->
<g transform="translate(320 320) scale(15) translate(-12 -12)" filter="url(#innerShadow) url(#innerHighlight)">
<path fill="#91813c" d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>
</g>


<!-- SHINE (LONG + FULL SWEEP) -->
<g clip-path="url(#badgeClip)" pointer-events="none">
  <rect x="-800" y="0" width="1800" height="800"
        fill="url(#shineGrad)"
        opacity="0.65"
        transform="rotate(205 320 320)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="1400 0"
      to="-1400 0"
      dur="4.5s"
      repeatCount="indefinite"
      additive="sum"/>
  </rect>
</g>

</svg>